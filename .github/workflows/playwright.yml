name: CI - Playwright

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        node: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Instalar navegadores y librerías del sistema
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Ejecutar pruebas de Playwright

      - name: Run Playwright Tests
        run: npx playwright test --reporter=html --reporter=dot --output=playwright-report --trace on-first-retry --config=playwright.config.js
        # env:
        #   BASE_URL: ${{ secrets.BASE_URL }} # Uncomment and set if needed


      # Publica artefactos (reportes, screenshots, videos, traces)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
